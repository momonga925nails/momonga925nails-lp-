<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momonga925 Nails - Curated Nail Art Picks</title>
<style>
  :root{
    --pink:#f5c6d0;
    --charcoal:#2b2b2b;
    --gold:#c9a86a;
    --cream:#faf6f2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Helvetica Neue',Arial,sans-serif;
    background:var(--cream);
    color:var(--charcoal);
    line-height:1.6;
  }
  header{
    padding:48px 20px 32px;
    text-align:center;
  }
  header h1{
    font-size:1.8rem;
    letter-spacing:0.05em;
    font-weight:600;
  }
  header p{
    color:#777;
    margin-top:8px;
    font-size:0.95rem;
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:0 20px 60px;
  }
  .note{
    background:#fff;
    border:1px solid #eee;
    border-radius:12px;
    padding:24px;
    text-align:center;
  }
  .note p{
    color:#555;
    font-size:0.95rem;
  }
  footer{
    text-align:center;
    padding:24px;
    color:#999;
    font-size:0.8rem;
  }
</style>
</head>
<body>
<header>
  <h1>momonga925nails</h1>
  <p>Curated nail art inspiration &amp; product picks</p>
</header>
<main>
  <div class="note">
    <p>Thanks for stopping by! Individual product pages are linked directly from our Pinterest pins.</p>
  </div>
</main>
<footer>
  &copy; 2026 momonga925nails
</footer>
</body>
</html>
